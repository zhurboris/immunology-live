<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 10 — Immunology Test</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="quiz-wrapper">
  <h2><em><b>Antibody to centromere is associated with:</b></em></h2>

  <div style="text-align: center; margin: 20px 0;">
    <img src="../images/slefon.gif" alt="SLE / CREST illustration" style="max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 3px 12px rgba(0,0,0,0.1);">
  </div>

  <div class="quiz-select-box">
    <form>
      <select name="sel" size="1">
        <option selected value="#">select the best answer:</option>
        <option value="no10.htm">Polymyositis</option>
        <option value="rez10.htm">CREST syndrome</option>
        <option value="no10.htm">Discoid lupus</option>
        <option value="no10.htm">Systemic lupus erythematosus</option>
        <option value="no10.htm">Sjogren's syndrome</option>
      </select>
    </form>
  </div>
</div>

<!-- QUICK BACK BUTTON -->
<div id="quick-nav-bar" style="position:fixed;bottom:15px;right:15px;z-index:99999;">
  <button onclick="history.back()" style="background:#1f4f4f;color:#ffffff;border:2px solid #ffffff;padding:8px 18px;border-radius:20px;box-shadow:0 3px 10px rgba(0,0,0,0.35);cursor:pointer;font-family:Arial,sans-serif;font-size:14px;font-weight:bold;">&#9664; Back</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var selects = document.querySelectorAll("select");
    selects.forEach(function(sel) {
        sel.addEventListener("change", function() {
            var url = this.value;
            if (url && url !== "#" && url !== "") {
                window.location.href = url;
            }
        });
    });
});
</script>
</body>
</html>

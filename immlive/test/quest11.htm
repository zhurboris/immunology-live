<div class="quiz-select-box"><table border="0">
    <tr>
        <td><form>
            <input type="hidden" name="select" value><p><select
            name="sel" size="1"
            onchange="top.location.href=this.options[this.selectedindex].value;">

        </td>

</table></div>

<!-- QUICK BACK BUTTON -->


</div>
<div id="quick-nav-bar" style="position:fixed;bottom:15px;right:15px;z-index:99999;"><button onclick="history.back()" style="background:#1f4f4f;color:#ffffff;border:2px solid #ffffff;padding:8px 18px;border-radius:20px;box-shadow:0 3px 10px rgba(0,0,0,0.35);cursor:pointer;font-family:Arial,sans-serif;font-size:14px;font-weight:bold;">&#9664; Back</button></div>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var selects = document.querySelectorAll("select");
    selects.forEach(function(sel) {
        sel.removeAttribute("onchange");
        sel.addEventListener("change", function() {
            var url = this.value;
            if (url && url !== "#" && url !== "") {
                window.location.href = url;
            }
        });
    });
});
</script>
